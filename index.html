<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>영화봇 · 배우별 영화 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0a0a0a;
  --bg-card: #141414;
  --bg-card-hover: #1c1c1c;
  --bg-elevated: #1a1a1a;
  --bg-sidebar: #0f0f0f;
  --gold: #d4af37;
  --gold-dim: #a6892d;
  --gold-soft: rgba(212, 175, 55, 0.15);
  --gold-border: rgba(212, 175, 55, 0.35);
  --text: #f0ebe3;
  --text-muted: #9a948a;
  --text-dim: #6b6560;
  --watched: #2a2418;
  --danger: #c45c5c;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.45);
  --sidebar-w: 260px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  font-family: "Noto Sans KR", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  line-height: 1.5;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212,175,55,0.12), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(80,60,20,0.15), transparent);
}
.app { display: flex; min-height: 100dvh; }
/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid #222;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow: hidden;
  z-index: 40;
}
.sidebar-head {
  padding: 1.25rem 1rem 1rem;
  border-bottom: 1px solid var(--gold-border);
}
.sidebar-head .eyebrow {
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.35rem;
}
.sidebar-head h1 {
  font-family: "Playfair Display", "Noto Sans KR", serif;
  font-size: 1.25rem;
  color: var(--gold);
  font-weight: 700;
}
.sidebar-head .sub {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 0.25rem;
}
.actor-nav {
  flex: 1;
  overflow-y: auto;
  padding: 0.75rem 0.5rem;
  -webkit-overflow-scrolling: touch;
}
.actor-btn {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  padding: 0.7rem 0.85rem;
  border-radius: 10px;
  cursor: pointer;
  font: inherit;
  font-size: 0.88rem;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  margin-bottom: 0.25rem;
  transition: background .15s, border-color .15s, color .15s;
}
.actor-btn:hover { background: var(--bg-card); color: var(--text); }
.actor-btn.active {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: var(--gold);
}
.actor-btn .name { font-weight: 600; }
.actor-btn .en { font-size: 0.72rem; color: var(--text-dim); font-style: italic; }
.actor-btn.active .en { color: var(--gold-dim); }
.actor-btn .prog {
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
}
.actor-btn.active .prog { color: var(--gold-dim); }
.mini-bar {
  height: 3px;
  background: #2a2a2a;
  border-radius: 2px;
  margin-top: 0.35rem;
  overflow: hidden;
}
.mini-bar > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 2px;
  width: 0%;
}
/* Main */
.main {
  flex: 1;
  min-width: 0;
  padding: 1.5rem 1.25rem calc(2.5rem + var(--safe-b));
  max-width: 820px;
}
header.page-head {
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--gold-border);
}
header.page-head h2 {
  font-family: "Playfair Display", "Noto Sans KR", serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  color: var(--gold);
  font-weight: 700;
}
header.page-head .subtitle {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-top: 0.25rem;
}
.progress-panel {
  background: var(--bg-elevated);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}
.progress-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.65rem;
}
.progress-label { font-size: 0.95rem; font-weight: 500; }
.progress-label strong { color: var(--gold); font-size: 1.3rem; }
.progress-pct { color: var(--gold-dim); font-weight: 700; font-size: 1.05rem; }
.bar { height: 8px; background: #2a2a2a; border-radius: 4px; overflow: hidden; }
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 4px;
  width: 0%;
  transition: width .35s ease;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-bottom: 1rem;
  align-items: center;
}
.search { flex: 1 1 180px; min-width: 0; }
.search input {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid #333;
  color: var(--text);
  padding: 0.7rem 0.9rem;
  border-radius: 10px;
  font: inherit;
  font-size: 0.9rem;
  outline: none;
}
.search input:focus { border-color: var(--gold-border); }
.search input::placeholder { color: var(--text-dim); }
.filter-group {
  display: flex;
  background: var(--bg-card);
  border: 1px solid #333;
  border-radius: 10px;
  overflow: hidden;
}
.filter-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 0.65rem 0.85rem;
  font: inherit;
  font-size: 0.82rem;
  cursor: pointer;
  white-space: nowrap;
}
.filter-btn.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }
.btn {
  background: var(--bg-card);
  border: 1px solid #444;
  color: var(--text-muted);
  padding: 0.65rem 0.9rem;
  border-radius: 10px;
  font: inherit;
  font-size: 0.82rem;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--gold-border); color: var(--gold); }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.list { list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }
.movie {
  display: flex;
  gap: 0.85rem;
  align-items: flex-start;
  background: var(--bg-card);
  border: 1px solid #222;
  border-radius: var(--radius);
  padding: 0.95rem 1rem;
  cursor: pointer;
  transition: background .15s, border-color .15s;
  -webkit-user-select: none;
  user-select: none;
}
.movie:hover { background: var(--bg-card-hover); border-color: #333; }
.movie.watched {
  background: var(--watched);
  border-color: var(--gold-border);
}
.movie input[type="checkbox"] {
  width: 1.25rem;
  height: 1.25rem;
  margin-top: 0.15rem;
  accent-color: var(--gold);
  flex-shrink: 0;
  cursor: pointer;
}
.info { flex: 1; min-width: 0; }
.titles { display: flex; flex-direction: column; gap: 0.1rem; }
.ko { font-weight: 600; font-size: 1.02rem; color: var(--text); }
.movie.watched .ko { color: var(--gold); }
.en { font-size: 0.85rem; color: var(--text-muted); font-style: italic; }
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 0.7rem;
  margin-top: 0.3rem;
  font-size: 0.78rem;
  color: var(--text-dim);
}
.year { color: var(--gold-dim); font-weight: 600; font-variant-numeric: tabular-nums; }
.genre::before, .note::before {
  content: "·";
  margin-right: 0.65rem;
  color: #444;
}
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-dim);
  display: none;
}
.empty.show { display: block; }
/* Overview cards */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.75rem;
}
.ov-card {
  background: var(--bg-card);
  border: 1px solid #222;
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.ov-card:hover { border-color: var(--gold-border); background: var(--bg-card-hover); }
.ov-card .n { font-weight: 700; color: var(--text); margin-bottom: 0.15rem; }
.ov-card .e { font-size: 0.78rem; color: var(--text-dim); font-style: italic; margin-bottom: 0.55rem; }
.ov-card .s { font-size: 0.85rem; color: var(--gold); font-variant-numeric: tabular-nums; }
footer {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid #222;
  font-size: 0.72rem;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.7;
}
/* Mobile drawer */
.menu-toggle {
  display: none;
  position: fixed;
  bottom: calc(1rem + var(--safe-b));
  left: 1rem;
  z-index: 60;
  background: var(--gold);
  color: #0a0a0a;
  border: none;
  border-radius: 999px;
  padding: 0.85rem 1.2rem;
  font: inherit;
  font-weight: 700;
  font-size: 0.9rem;
  box-shadow: 0 8px 28px rgba(212,175,55,0.35);
  cursor: pointer;
}
.backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 35;
}
.backdrop.show { display: block; }
@media (max-width: 820px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0;
    transform: translateX(-105%);
    transition: transform .25s ease;
    box-shadow: 8px 0 32px rgba(0,0,0,0.5);
  }
  .sidebar.open { transform: translateX(0); }
  .menu-toggle { display: block; }
  .main { padding: 1.1rem 1rem calc(5rem + var(--safe-b)); width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="배우 목록">
    <div class="sidebar-head">
      <p class="eyebrow">영화봇</p>
      <h1>영화 체크리스트</h1>
      <p class="sub" id="sidebar-total">—</p>
    </div>
    <nav class="actor-nav" id="actor-nav"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <header class="page-head">
      <h2 id="page-title">전체</h2>
      <p class="subtitle" id="page-sub">배우별 장편 출연작 시청 체크</p>
    </header>
    <div class="progress-panel">
      <div class="progress-top">
        <span class="progress-label">시청 완료 <strong id="watched-count">0</strong> / <span id="total-count">0</span></span>
        <span class="progress-pct" id="pct">0%</span>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
    <div class="controls" id="controls">
      <div class="search">
        <input type="search" id="search" placeholder="제목 검색 (한글/영문)…" autocomplete="off" enterkeyhint="search" />
      </div>
      <div class="filter-group" role="group" aria-label="필터">
        <button type="button" class="filter-btn active" data-filter="all">전체</button>
        <button type="button" class="filter-btn" data-filter="watched">본 영화</button>
        <button type="button" class="filter-btn" data-filter="unwatched">안 본 영화</button>
      </div>
      <button type="button" class="btn danger" id="clear-btn" title="체크 해제">체크 해제</button>
    </div>
    <div id="content"></div>
    <p class="empty" id="empty">검색·필터 결과가 없습니다.</p>
    <footer>
      장편 출연작 기준 · 제작만·TV·미개봉·사소한 카메오 제외<br />
      출처: Wikipedia filmography · 진행 상태는 이 기기 localStorage에 저장됩니다<br />
      <span id="footer-uncertain"></span>
    </footer>
  </main>
</div>
<button type="button" class="menu-toggle" id="menu-toggle" aria-label="배우 목록 열기">배우 선택</button>

<script src="./movies-data.js"></script>
<script>
(function () {
  const DATA = window.MOVIE_CHECKLIST_DATA;
  const STORAGE_KEY = DATA.storageKey || "movie-checklist-v1";
  const actors = DATA.actors;

  let current = "all"; // "all" or actor id
  let filter = "all";
  let state = loadState();

  const navEl = document.getElementById("actor-nav");
  const contentEl = document.getElementById("content");
  const emptyEl = document.getElementById("empty");
  const searchEl = document.getElementById("search");
  const watchedCountEl = document.getElementById("watched-count");
  const totalCountEl = document.getElementById("total-count");
  const pctEl = document.getElementById("pct");
  const barFill = document.getElementById("bar-fill");
  const pageTitle = document.getElementById("page-title");
  const pageSub = document.getElementById("page-sub");
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  const menuToggle = document.getElementById("menu-toggle");
  const clearBtn = document.getElementById("clear-btn");
  const sidebarTotal = document.getElementById("sidebar-total");

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const obj = JSON.parse(raw);
      return obj && typeof obj === "object" ? obj : {};
    } catch (e) {
      return {};
    }
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function watchedSet(actorId) {
    const arr = state[actorId];
    return new Set(Array.isArray(arr) ? arr : []);
  }
  function setWatched(actorId, set) {
    state[actorId] = [...set];
    saveState();
  }
  function movieKey(actorId, movieId) {
    return actorId + ":" + movieId;
  }

  function overallStats() {
    let total = 0, watched = 0;
    actors.forEach((a) => {
      total += a.movies.length;
      const w = watchedSet(a.id);
      a.movies.forEach((m) => { if (w.has(m.id)) watched++; });
    });
    return { total, watched };
  }
  function actorStats(a) {
    const w = watchedSet(a.id);
    let n = 0;
    a.movies.forEach((m) => { if (w.has(m.id)) n++; });
    return { total: a.movies.length, watched: n };
  }

  function closeDrawer() {
    sidebar.classList.remove("open");
    backdrop.classList.remove("show");
  }
  function openDrawer() {
    sidebar.classList.add("open");
    backdrop.classList.add("show");
  }

  function renderNav() {
    navEl.innerHTML = "";
    const overall = overallStats();
    sidebarTotal.textContent =
      "전체 " + overall.watched + " / " + overall.total + " · " + actors.length + "명 배우";

    const allBtn = document.createElement("button");
    allBtn.type = "button";
    allBtn.className = "actor-btn" + (current === "all" ? " active" : "");
    allBtn.innerHTML =
      '<span class="name">전체 현황</span>' +
      '<span class="en">Overview</span>' +
      '<span class="prog">' + overall.watched + " / " + overall.total + "</span>" +
      '<div class="mini-bar"><i style="width:' +
      (overall.total ? Math.round((overall.watched / overall.total) * 100) : 0) +
      '%"></i></div>';
    allBtn.addEventListener("click", () => { current = "all"; closeDrawer(); render(); });
    navEl.appendChild(allBtn);

    actors.forEach((a) => {
      const s = actorStats(a);
      const pct = s.total ? Math.round((s.watched / s.total) * 100) : 0;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "actor-btn" + (current === a.id ? " active" : "");
      btn.innerHTML =
        '<span class="name">' + a.nameKo + "</span>" +
        '<span class="en">' + a.nameEn + "</span>" +
        '<span class="prog">' + s.watched + " / " + s.total + " (" + pct + "%)</span>" +
        '<div class="mini-bar"><i style="width:' + pct + '%"></i></div>';
      btn.addEventListener("click", () => { current = a.id; closeDrawer(); render(); });
      navEl.appendChild(btn);
    });
  }

  function updateProgress(watched, total) {
    const pct = total ? Math.round((watched / total) * 100) : 0;
    watchedCountEl.textContent = watched;
    totalCountEl.textContent = total;
    pctEl.textContent = pct + "%";
    barFill.style.width = pct + "%";
  }

  function matchesSearch(m, q) {
    if (!q) return true;
    const hay = (m.ko + " " + m.en + " " + m.year + " " + (m.genre || "") + " " + (m.note || "")).toLowerCase();
    return hay.includes(q);
  }

  function renderOverview() {
    pageTitle.textContent = "전체 현황";
    pageSub.textContent = "배우를 선택해 시청 체크를 이어가세요";
    const ov = overallStats();
    updateProgress(ov.watched, ov.total);
    clearBtn.textContent = "전체 체크 해제";
    contentEl.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "overview-grid";
    actors.forEach((a) => {
      const s = actorStats(a);
      const pct = s.total ? Math.round((s.watched / s.total) * 100) : 0;
      const card = document.createElement("div");
      card.className = "ov-card";
      card.innerHTML =
        '<div class="n">' + a.nameKo + "</div>" +
        '<div class="e">' + a.nameEn + "</div>" +
        '<div class="s">' + s.watched + " / " + s.total + " · " + pct + "%</div>" +
        '<div class="mini-bar" style="margin-top:.5rem"><i style="width:' + pct + '%"></i></div>';
      card.addEventListener("click", () => { current = a.id; render(); });
      grid.appendChild(card);
    });
    contentEl.appendChild(grid);
    emptyEl.classList.remove("show");
  }

  function renderActorList(actor) {
    pageTitle.textContent = actor.nameKo;
    pageSub.textContent = actor.nameEn + " · Feature Film Acting Credits";
    const w = watchedSet(actor.id);
    const s = actorStats(actor);
    updateProgress(s.watched, s.total);
    clearBtn.textContent = "이 배우 체크 해제";

    const q = searchEl.value.trim().toLowerCase();
    contentEl.innerHTML = "";
    const ul = document.createElement("ul");
    ul.className = "list";
    ul.setAttribute("aria-label", actor.nameKo + " 영화 목록");
    let visible = 0;
    const movies = actor.movies.slice().sort((a, b) => a.year - b.year || a.ko.localeCompare(b.ko, "ko"));

    movies.forEach((m) => {
      const isWatched = w.has(m.id);
      if (filter === "watched" && !isWatched) return;
      if (filter === "unwatched" && isWatched) return;
      if (!matchesSearch(m, q)) return;
      visible++;

      const li = document.createElement("li");
      li.className = "movie" + (isWatched ? " watched" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = isWatched;
      cb.setAttribute("aria-label", m.ko + " 시청 여부");

      const info = document.createElement("div");
      info.className = "info";
      const titles = document.createElement("div");
      titles.className = "titles";
      const ko = document.createElement("span");
      ko.className = "ko";
      ko.textContent = m.ko;
      const en = document.createElement("span");
      en.className = "en";
      en.textContent = m.en;
      titles.append(ko, en);
      const meta = document.createElement("div");
      meta.className = "meta";
      const year = document.createElement("span");
      year.className = "year";
      year.textContent = m.year;
      meta.appendChild(year);
      if (m.genre) {
        const g = document.createElement("span");
        g.className = "genre";
        g.textContent = m.genre;
        meta.appendChild(g);
      }
      if (m.note) {
        const n = document.createElement("span");
        n.className = "note";
        n.textContent = m.note;
        meta.appendChild(n);
      }
      info.append(titles, meta);
      li.append(cb, info);

      const toggle = () => {
        const set = watchedSet(actor.id);
        if (set.has(m.id)) set.delete(m.id);
        else set.add(m.id);
        setWatched(actor.id, set);
        render();
      };
      li.addEventListener("click", (e) => { if (e.target === cb) return; toggle(); });
      cb.addEventListener("change", toggle);
      ul.appendChild(li);
    });

    contentEl.appendChild(ul);
    emptyEl.classList.toggle("show", visible === 0);
  }

  function render() {
    renderNav();
    if (current === "all") {
      document.getElementById("controls").style.display = "none";
      renderOverview();
    } else {
      document.getElementById("controls").style.display = "flex";
      const actor = actors.find((a) => a.id === current);
      if (actor) renderActorList(actor);
    }
  }

  document.querySelectorAll(".filter-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      filter = btn.dataset.filter;
      render();
    });
  });
  searchEl.addEventListener("input", () => { if (current !== "all") render(); });

  clearBtn.addEventListener("click", () => {
    if (current === "all") {
      const ov = overallStats();
      if (!ov.watched) return;
      if (!confirm("모든 배우의 시청 체크를 해제할까요?")) return;
      state = {};
      saveState();
    } else {
      const w = watchedSet(current);
      if (!w.size) return;
      const actor = actors.find((a) => a.id === current);
      if (!confirm((actor ? actor.nameKo : "이 배우") + "의 시청 체크를 모두 해제할까요?")) return;
      setWatched(current, new Set());
    }
    render();
  });

  menuToggle.addEventListener("click", () => {
    if (sidebar.classList.contains("open")) closeDrawer();
    else openDrawer();
  });
  backdrop.addEventListener("click", closeDrawer);

  const unc = (DATA.uncertainTitles || []).slice(0, 3);
  if (unc.length) {
    document.getElementById("footer-uncertain").textContent =
      "불확실 표기 예: " + unc.join(" · ");
  }

  render();
})();
</script>
</body>
</html>
